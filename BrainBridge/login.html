<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Brain Bridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Main Login Container -->
    <div class="login-container">
        <!-- Left Side (Illustration) -->
        <div class="login-left">
            <div class="login-content">
                <div class="login-brand">
                    <h1><span style="color: #ff68bd;">Brain</span><span style="color: #07bdff;">Bridge</span></h1>
                    <p class="tagline">Connect. Learn. Grow.</p>
                </div>
                <div class="illustration-container">
                    <img src="https://illustrations.popsy.co/amber/digital-nomad.svg" alt="Brain Bridge Illustration" class="login-illustration">
                </div>
                <div class="login-footer">
                    <p>Don't have an account? <a href="">Sign up</a></p>
                </div>
            </div>
        </div>

        <!-- Right Side (Login Form) -->
        <div class="login-right">
            <div class="login-form-container">
                <h2>Welcome Back!</h2>
                <p class="subtext">Please enter your credentials to login</p>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                            <button type="button" class="btn btn-toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="d-flex justify-content-between mt-2">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                            <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login">Login</button>

                    <div class="divider">or continue with</div>

                    <div class="social-login">
                        <button type="button" class="btn btn-social btn-google">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button type="button" class="btn btn-social btn-microsoft">
                            <i class="fab fa-microsoft"></i> Microsoft
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Add your login logic here
            alert('Login functionality will be implemented here!');
            // window.location.href = "dashboard.html"; // Redirect after login
        });
    </script>
</body>
</html>
